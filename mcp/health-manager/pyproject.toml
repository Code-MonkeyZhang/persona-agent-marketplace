[project]
name = "health-manager"
version = "0.2.0"
description = "个人健康指标记录 Agent App"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0",
    "uvicorn[standard]",
]

[project.scripts]
health-manager = "health_manager.__main__:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["health_manager*"]

[tool.setuptools.package-data]
health_manager = ["../../ui/**/*", "../../icon.png"]
