[project]
name = "pomodoro-timer"
version = "0.1.0"
description = "番茄时钟 Agent App"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0",
    "uvicorn[standard]",
]

[project.scripts]
pomodoro-timer = "pomodoro_timer.__main__:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pomodoro_timer*"]

[tool.setuptools.package-data]
pomodoro_timer = ["../../ui/**/*", "../../icon.png"]
